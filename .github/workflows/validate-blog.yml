name: Validate Blog

on:
  push:
  pull_request:

jobs:
  validate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate blog manifest and assets
        run: node scripts/validate-blog.mjs
