<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f1e8" />
    <title>Sid's Monthly Digest</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="blog-body">
    <main class="blog-shell">
      <header class="blog-hero">
        <a class="back-link" href="../gift.html">Back to gift</a>
        <p class="kicker">Archive</p>
        <h1>Sid's Monthly Digest</h1>
        <p class="lede">
          Monthly updates, written here instead of scattered across texts I
          forgot to send.
        </p>
      </header>

      <section class="blog-status" id="blog-status" aria-live="polite">
        <p class="panel-label">Not open yet</p>
        <h2>Digest archive is set up.</h2>
        <p>
          Add the first Markdown update, list it in <code>blog/manifest.json</code>,
          and flip <code>enabled</code> to <code>true</code>.
        </p>
      </section>

      <section class="post-list" id="post-list" aria-label="Digest posts" hidden></section>
    </main>

    <script src="blog.js"></script>
  </body>
</html>
