<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f1e8" />
    <title>Sid's Monthly Digest</title>
    <link rel="stylesheet" href="../styles.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
  </head>
  <body class="blog-body">
    <main class="post-shell">
      <nav class="post-nav" aria-label="Post navigation">
        <a class="back-link" href="./">All updates</a>
      </nav>

      <header class="post-header" id="post-header" hidden>
        <p class="kicker" id="post-date"></p>
        <h1 id="post-title"></h1>
        <p class="lede" id="post-summary"></p>
      </header>

      <section class="blog-status" id="post-status" aria-live="polite">
        <p class="panel-label">Loading</p>
        <h2>Opening update.</h2>
        <p>One moment.</p>
      </section>

      <article class="markdown-frame" id="markdown-frame" hidden>
        <zero-md id="post-content">
          <template data-append>
            <style>
              :host {
                color: #26332d;
                font-family: "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
                font-size: 18px;
                line-height: 1.72;
              }

              .markdown-body {
                max-width: none;
                padding: 0;
                color: #26332d;
                background: transparent;
                box-shadow: none;
              }

              h1,
              h2,
              h3 {
                color: #26332d;
                font-family: Georgia, "Times New Roman", serif;
                letter-spacing: 0;
                text-wrap: balance;
              }

              h1 {
                display: none;
              }

              h2 {
                margin: 2.6rem 0 0.8rem;
                padding: 0;
                border: 0;
                font-size: 2rem;
                line-height: 1.08;
              }

              h3 {
                margin: 2rem 0 0.65rem;
                padding: 0;
                border: 0;
                font-size: 1.35rem;
              }

              p {
                margin: 0 0 1.2rem;
                color: #4f463c;
                text-wrap: pretty;
              }

              a {
                color: #2e657f;
                text-decoration-thickness: 1px;
                text-underline-offset: 4px;
              }

              img {
                display: block;
                width: 100%;
                height: auto;
                margin: 2rem 0 0.55rem;
                border-radius: 16px;
                background: #f2eadc;
                box-shadow:
                  0 18px 42px rgba(55, 39, 19, 0.12),
                  0 0 0 1px rgba(0, 0, 0, 0.1);
              }

              em {
                display: block;
                margin: -0.1rem 0 1.9rem;
                color: #72685d;
                font-size: 0.9rem;
                line-height: 1.45;
              }

              blockquote {
                margin: 2rem 0;
                padding: 0.2rem 0 0.2rem 1.2rem;
                border-left: 3px solid #c6533c;
                color: #26332d;
              }

              blockquote p {
                color: #26332d;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.25rem;
                line-height: 1.45;
              }

              hr {
                margin: 2.5rem 0;
                border: 0;
                border-top: 1px solid rgba(38, 51, 45, 0.14);
              }

              ul,
              ol {
                margin: 0 0 1.3rem;
                padding-left: 1.4rem;
                color: #4f463c;
              }

              li + li {
                margin-top: 0.35rem;
              }

              code {
                padding: 0.08rem 0.28rem;
                border-radius: 6px;
                background: rgba(38, 51, 45, 0.08);
                font-size: 0.92em;
              }
            </style>
          </template>
        </zero-md>
      </article>
    </main>

    <script src="post.js"></script>
  </body>
</html>
